<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Your cart · Mug Shop</title><link rel="stylesheet" href="/shared.css"><script src="cart.js"></script></head>
<body>
  <main>
    <h1>Your cart</h1>
    <ul id="items"></ul>
    <p id="total"></p>
    <button type="button" id="checkout">Checkout</button>
    <a href="index.html">Keep shopping</a>
  </main>
  <script>
    const items = cart();
    document.getElementById('items').innerHTML = items.length
      ? items.map((id) => `<li>${PRODUCTS[id].name}, $${PRODUCTS[id].price}</li>`).join('')
      : '<li>Your cart is empty</li>';
    document.getElementById('total').textContent = `Total: $${items.reduce((sum, id) => sum + PRODUCTS[id].price, 0)}`;
    document.getElementById('checkout').disabled = items.length === 0;
    document.getElementById('checkout').addEventListener('click', () => (location.href = 'shipping.html'));
  </script>
</body>
</html>
