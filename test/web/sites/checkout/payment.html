<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Payment · Mug Shop</title><link rel="stylesheet" href="/shared.css"><script src="cart.js"></script></head>
<body>
  <main>
    <h1>Step 2 of 3: Payment</h1>
    <form id="payment">
      <fieldset>
        <legend>Pay with</legend>
        <label><input type="radio" name="method" value="card-4242" checked> Saved card ending in 4242</label>
        <label><input type="radio" name="method" value="paypal"> PayPal</label>
      </fieldset>
      <button>Continue</button>
    </form>
  </main>
  <script>
    document.getElementById('payment').addEventListener('submit', (event) => {
      event.preventDefault();
      save('order', { ...order(), method: new FormData(event.target).get('method') });
      location.href = 'review.html';
    });
  </script>
</body>
</html>
